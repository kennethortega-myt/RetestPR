# Expires map
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/json           max;
    application/javascript     max;
    ~image/                    max;
}

# Desactivar la divulgación de la versión de Nginx
server_tokens off;

server {
  listen 80;
  include mime.types;
  types {
    application/javascript mjs;
  }

  location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
      try_files $uri $uri/ /index.html =404;
   
    }

  # default timeouts here
  proxy_connect_timeout 10000s;
  proxy_send_timeout 10000s;
  proxy_read_timeout 10000s;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
  ssl_prefer_server_ciphers on;

  set $cspNonce $request_id;
  sub_filter_once off;
  sub_filter_types *;
  sub_filter NGINX_CSP_NONCE $cspNonce;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin" always;

  add_header Content-Security-Policy "default-src 'self' blob:; frame-src 'self' blob: https://www.google.com; script-src 'self' 'unsafe-eval' 'nonce-$cspNonce' https://code.createjs.com https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/legacy/build/pdf.worker.min.mjs https://www.googletagmanager.com https://www.google-analytics.com; script-src-elem 'self' 'nonce-$cspNonce' https://code.createjs.com https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/legacy/build/pdf.worker.min.mjs https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.google-analytics.com; base-uri 'self'; connect-src 'self' blob: https://www.google.com https://www.gstatic.com https://cdn.jsdelivr.net https://www.google-analytics.com https://www.googletagmanager.com data:; worker-src 'self' blob:" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Feature-Policy "accelerometer 'none'; camera 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; usb 'none'";
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  client_max_body_size 20M;
  expires $expires;
  gzip  on;
}
