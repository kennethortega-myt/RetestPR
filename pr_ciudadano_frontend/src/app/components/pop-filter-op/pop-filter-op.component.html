<div class="p-2">
  <div class="">
    <div class="alinear_boton_cerrar">
      <button class="cerrar_menu" (click)="closeFilterOp()">
        <img src="assets/img/icons/ico_x.svg" alt="" />
      </button>
    </div>

    <div class="cabecera-menu">
      <img alt="ico-ubigeo2" src="assets/img/icons/ico-candi1.svg" />
      <h2>{{ tituloKey | translate }}</h2>
      <p>
        {{ descripcionKey | translate }} <strong>{{ botonFiltrarKey | translate }}</strong
        >.
      </p>
    </div>
    <form>
      <div class="conte_select_movil">
        <app-c-select-mvalues
          class="select-100"
          [label]="'Organización Política'"
          [placeholder]="'Seleccione'"
          [electionID]="data.electionID"
          (sendSelectedData)="selectedData($event)"
        />
      </div>
      @if (candidate) {
        <div class="cont-botones mt-1">
          <button class="estilo2" (click)="aceptarFiltro($event)">{{ botonFiltrarKey | translate }}</button>
        </div>
      }
    </form>
  </div>
</div>
