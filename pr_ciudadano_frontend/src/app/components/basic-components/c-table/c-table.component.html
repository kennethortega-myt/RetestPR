<div>
    <table mat-table [dataSource]="dataSource" aria-label="Tabla de datos">
  
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef  class="t-c"> No. </th>
        <td mat-cell *matCellDef="let element"  class="t-c"> {{element.position}} </td>
      </ng-container>
   
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef  class="t-c"> Name </th>
        <td mat-cell *matCellDef="let element"  class="t-c"> {{element.name}} </td>
      </ng-container>
  
      <ng-container matColumnDef="weight">
        <th mat-header-cell *matHeaderCellDef  class="t-c"> Weight </th>
        <td mat-cell *matCellDef="let element"  class="t-c"> {{element.weight}} </td>
      </ng-container>
  
      <ng-container matColumnDef="symbol"   class="t-c">
        <th mat-header-cell *matHeaderCellDef> Symbol </th>
        <td mat-cell *matCellDef="let element"  class="t-c"> {{element.symbol}} </td>
      </ng-container>
  

      <ng-container matColumnDef="btn">
        <th mat-header-cell *matHeaderCellDef  class="t-c"> Opciones </th>
        <td mat-cell *matCellDef="let element" class="t-c"> 
          <button class="btn_eliminar"></button>
          <button class="btn_pdf"></button>
          <button class="btn_doc"></button>
          <button class="btn_editar"></button>
        </td>
      </ng-container>



      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
</div>
