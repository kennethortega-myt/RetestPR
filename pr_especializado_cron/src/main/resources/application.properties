
server.port=8080
server.servlet.context-path=${APPLICATION_ROOT_COP}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#spring.data.mongodb.uri=mongodb://${MONGO_USER}:${MONGO_PASS}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}

# Base de datos primaria
spring.data.mongodb.primary.uri = mongodb://${MONGO_USER_P}:${MONGO_PASS_P}@${MONGO_HOST_P}:${MONGO_PORT_P}?authSource=${MONGO_DB_SOURCE}&replicaSet=rs0&tls=true
spring.data.mongodb.primary.database = ${MONGO_DB_P}

# Base de datos secundaria
spring.data.mongodb.secondary.uri = mongodb://${MONGO_USER_S}:${MONGO_PASS_S}@${MONGO_HOST_S}:${MONGO_PORT_S}?authSource=${MONGO_DB_SOURCE}&replicaSet=rs0&tls=true
spring.data.mongodb.secondary.database = ${MONGO_DB_S}


logging.level.root=INFO
logging.level.pe.gob.onpe.consultaopcron=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO

cop.backend.url=${COP_BACKEND_URL}
tiempo.programacion.bd=${TIEMPO_PROGRAMACION_BD}

security.jwt.tokenExpirationTime=300
security.jwt.refreshTokenExpTime=600
security.jwt.tokenIssuer=ONPE
security.jwt.tokenSigningKey=${JWT_SECRET}
